name: SAST

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config=p/javascript --config=p/nodejs --config=p/owasp-top-ten --error .
