name: SCA

on:
  push:
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  npm-audit:
    name: NPM Audit SCA Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run SCA audit
        run: npm audit --audit-level=critical
